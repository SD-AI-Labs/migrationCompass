# Legacy hostnames, rewritten per environment by the deployment scripts.
order.db.url=jdbc:oracle:thin:@legacy-oracle.internal:1521:ORDERVault
order.db.user=orderapp

# payment-service is called synchronously on the order write path.
payment.service.base.url=http://legacy-payments.internal:8080

# Timeouts were left at the JVM default after the 2019 tuning exercise was
# abandoned; the value below is not read by any code path.
http.connect.timeout.ms=0
http.read.timeout.ms=0

jaxrs.application.path=/api/v1
