# Legacy hostnames, rewritten per environment by the deployment scripts.
payment.db.url=jdbc:oracle:thin:@legacy-oracle.internal:1521:ORDERVault
payment.db.user=payapp

# External payment processor. Credentials are held in the deployment plan, not here.
payment.gateway.url=https://gateway.example-processor.test/api/v2

# Rate limiting: documented in the processor's contract but not implemented.
payment.gateway.rate.limit.per.minute=120
payment.gateway.retry.enabled=false

# Set during the 2021 incident review and never read by any code path.
payment.idempotency.enabled=false

jaxrs.application.path=/api/v1
