# Legacy hostnames, hardcoded per environment by the deployment scripts.
customer.db.url=jdbc:oracle:thin:@legacy-oracle.internal:1521:ORDERVault
customer.db.user=custapp

# order-service is reached over plain HTTP on an internal hostname.
# No timeout is configured anywhere in the client.
order.service.base.url=http://legacy-orders.internal:8080

# WebLogic-managed defaults from the original deployment plan.
weblogic.http.timeout=0
jaxrs.application.path=/api/v1

# Deprecated: the postal verification API this used to point at was decommissioned
# in 2023, but the property is still read by the address validation path.
postal.verification.url=http://postal-verify.internal/validate
postal.verification.enabled=true
