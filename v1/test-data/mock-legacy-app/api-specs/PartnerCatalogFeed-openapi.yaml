# OrderVault :: PartnerCatalogFeed
# SYNTHETIC / FICTIONAL SPEC — created as test data for a portfolio project.
# Not a real company's API.
#
# NOTE: Added in 2020 as a REST/OpenAPI service for a B2B partner integration.
# Built alongside the legacy SOAP services WITHOUT touching them — this is
# the source of the InventoryCheckService/PartnerCatalogFeed duplication
# flagged in architecture-overview.md.

openapi: 3.0.3
info:
  title: PartnerCatalogFeed
  description: >
    B2B partner-facing catalog and stock feed. Introduced in 2020 to serve
    a single external partner integration. Duplicates some stock-lookup
    logic from InventoryCheckService (legacy SOAP) — the two data sources
    are NOT guaranteed to be consistent under high load, since they read
    from different cached snapshots of the same underlying Oracle DB.
  version: "1.3.0"
servers:
  - url: https://partner-api.ordervault.example.com/v1

paths:
  /catalog/{sku}/stock:
    get:
      summary: Get current stock level for a SKU (partner-facing)
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock info
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku:
                    type: string
                  availableQuantity:
                    type: integer
                  lastSyncedAt:
                    type: string
                    format: date-time
                    description: >
                      Timestamp of the last cache sync from the core inventory
                      DB. Under normal conditions this lags real-time by
                      2-5 minutes; during flash sales, lag has been observed
                      up to 20 minutes, which is the root cause of partner
                      complaints about stale stock data.

  /catalog:
    get:
      summary: List catalog items visible to this partner
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Paginated catalog listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sku:
                          type: string
                        name:
                          type: string
                        category:
                          type: string
                        availableQuantity:
                          type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer

components:
  securitySchemes:
    partnerApiKey:
      type: apiKey
      in: header
      name: X-Partner-Api-Key

security:
  - partnerApiKey: []
