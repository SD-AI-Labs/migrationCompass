apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

dependencies {
    implementation project(':common')
    implementation project(':persistence-module')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 'common' already brings in the DeepSeek (chat) and Ollama (embeddings)
    // starters transitively — see chat-module/tools-module for the same
    // pattern. We only need the RAG-specific advisor artifact here, which
    // isn't part of any starter. NOTE: this artifact was renamed from
    // 'spring-ai-advisors-vector-store' to 'spring-ai-vector-store-advisor'
    // in the Spring AI 2.0.0 GA release — the old name no longer resolves.
    implementation 'org.springframework.ai:spring-ai-vector-store-advisor'

    // RetrievalAugmentationAdvisor, VectorStoreDocumentRetriever,
    // RewriteQueryTransformer, ContextualQueryAugmenter — Spring AI's
    // newer modular RAG pipeline (query transformation -> retrieval ->
    // query augmentation, each independently swappable), used in place of
    // the older QuestionAnswerAdvisor for query rewriting + tuned
    // retrieval (see RagChatConfig). Separate artifact from
    // spring-ai-vector-store-advisor above — QuestionAnswerAdvisor and
    // this modular RAG API ship in different modules.
    implementation 'org.springframework.ai:spring-ai-rag'

    // Auto-configures a PgVectorStore bean once spring.datasource.* and
    // spring.ai.vectorstore.pgvector.* properties are set (see
    // application.yml) — replaces the old in-memory SimpleVectorStore.
    // persistence-module (above) brings spring-boot-starter-data-jpa and
    // the postgresql driver transitively via its 'api' configuration.
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Distributed tracing (Micrometer + Zipkin) — spring-boot-starter-zipkin
    // (Boot 4.x) bundles the Brave tracing bridge + Zipkin reporter
    // automatically, no separate micrometer-tracing-bridge-brave /
    // zipkin-reporter-brave declarations needed. Spring AI's ChatClient
    // calls are automatically instrumented once this is on the
    // classpath — no extra code, just this dependency + application.yml
    // config (see logging.level / management.tracing.* there).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-zipkin'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
    archiveFileName = 'rag-module.jar'
}
