apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

dependencies {
    implementation project(':common')
    implementation project(':persistence-module')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 'common' brings in the DeepSeek starter, but only on the RUNTIME
    // classpath (Gradle's 'implementation' config doesn't expose a
    // project dependency's own dependencies at COMPILE time to consumers).
    // Since this module's Java code directly imports ChatClient, it needs
    // its own direct declaration here too — same fix applied to
    // structured-output-module for the identical reason.
    implementation 'org.springframework.ai:spring-ai-starter-model-deepseek'

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Distributed tracing (Micrometer + Zipkin) — spring-boot-starter-zipkin
    // (Boot 4.x) bundles the Brave tracing bridge + Zipkin reporter
    // automatically, no separate micrometer-tracing-bridge-brave /
    // zipkin-reporter-brave declarations needed. Spring AI's ChatClient
    // calls are automatically instrumented once this is on the
    // classpath — no extra code, just this dependency + application.yml
    // config (see logging.level / management.tracing.* there).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-zipkin'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
    archiveFileName = 'agent-module.jar'
}
